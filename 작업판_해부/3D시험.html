<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D 근육 시험 — 워너비 남성 21칸</title>
<style>
:root{--bg:#efe8df;--br:#6f4a2f;--tx:#1f1813;--s2:#5d5249;--s3:#837666;--line:#e6ddd2}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:'Pretendard',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
#wrap{display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-left,0px)) 24px}
h1{font-size:18px;margin:0}p.s{font-size:13px;font-weight:500;color:var(--s3);margin:4px 0 8px;line-height:1.5}
.an{display:flex;gap:6px;margin-bottom:8px}
.an button{flex:1;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit;font-size:14px;font-weight:800;color:#5d5249;cursor:pointer}
.an button.on{background:var(--br);border-color:var(--br);color:#fff}
#v{height:62vh;min-height:380px;background:#fff;border:1px solid var(--line);border-radius:20px;position:relative;overflow:hidden;touch-action:none}
#v .tg{position:absolute;top:10px;font-size:13px;font-weight:700;color:var(--s3);pointer-events:none}
#ld{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;color:var(--s3)}
#rot{position:absolute;right:10px;bottom:10px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font:inherit;font-size:13px;font-weight:700;color:#5d5249;cursor:pointer}
#rot.on{background:var(--br);border-color:var(--br);color:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:10px}
.card .t{font-size:14px;font-weight:800;margin-bottom:6px}
.card .t small{font-weight:600;color:var(--s3);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:700;color:#5d5249;background:#f6f1ea}
.chip i{width:10px;height:10px;border-radius:3px}
.chip.no{color:var(--s3);background:#fff;border:1px dashed #d8cfc4}
#one{margin-top:10px;font-size:14px;font-weight:500;color:var(--s3);text-align:center;line-height:1.5}
#one > b{font-weight:600;color:var(--s2)}   /* 11/27 대표 「강조가 너무 많아」 → 제작북 2-6 : 「운동 부족」 = 부가 · 부위 이름 = 서브 */
/* 11/27 대표 「뒤로가기 버튼 잘 안 보일 수도 · 효과?」 → 브라운으로 채우고, 세부에 들어갈 때 세 번 물결 */
#bk2{position:absolute;left:10px;top:10px;height:38px;padding:0 16px;border-radius:999px;border:0;background:var(--br);font:inherit;font-size:14px;font-weight:800;color:#fff;cursor:pointer;z-index:2;box-shadow:0 2px 8px rgba(111,74,47,.25)}
#bk2.hint{animation:뒤로물결 1s ease-out 3}
@keyframes 뒤로물결{0%{box-shadow:0 0 0 0 rgba(111,74,47,.55)}100%{box-shadow:0 0 0 14px rgba(111,74,47,0)}}
.zm{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.zm button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit;font-size:22px;font-weight:700;color:#5d5249;cursor:pointer;line-height:1}
#dim{position:fixed;inset:0;background:rgba(31,24,19,.45);z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:#fff;border-radius:24px 24px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));z-index:21;transform:translateY(105%);transition:transform .25s ease}
#sheet.on{transform:none}
#sheet .grab{width:40px;height:5px;border-radius:9px;background:#e6ddd2;margin:0 auto 12px}
#sheet .st{font-size:16px;font-weight:800;margin-bottom:12px}
#sheet .st small{font-size:13px;color:var(--s3);font-weight:600}
#sheet .st .h1{font-size:16px;font-weight:700;display:flex;align-items:center;gap:6px}
#sheet .st .h1 b{color:var(--tx);display:inline-block}
#sheet .st .h1 .u{font-size:13px;font-weight:500;color:var(--s3);margin-left:-4px}
#sheet .st .h1 b.pop{animation:숫자 .5s .15s cubic-bezier(.3,1.6,.5,1) both}
@keyframes 숫자{0%{transform:scale(.6)}100%{transform:scale(1)}}
#sheet .st{position:relative}
#sheet .st .lg{margin-left:auto;display:flex;align-items:center;gap:5px;font:inherit;font-size:13px;font-weight:500;color:var(--s3);background:none;border:0;padding:4px 0 4px 6px;cursor:pointer}
#sheet .st .lg .inf{width:18px;height:18px;border-radius:50%;border:1px solid #c9bfb3;background:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;color:#5d5249}   /* 기준 말풍선 여는 단추 (테 + 바탕) */
#sheet .tip{position:absolute;left:0;right:0;top:34px;z-index:3;background:#f6f1ea;border:1px solid #e6ddd2;border-radius:12px;padding:10px 12px;box-shadow:0 6px 18px rgba(31,24,19,.12)}
#sheet .tip[hidden]{display:none}
/* 11/27 대표 「말풍선이 위로 뜨거나 주변이 어두워져야」 → 열리면 창 나머지를 어둡게 · 말풍선은 흰 바탕 + 그림자 + 톡 떠오름 */
#sheet.tipon::after{content:'';position:absolute;inset:0;border-radius:inherit;background:rgba(31,24,19,.42);z-index:2}
#sheet.tipon .st .lg{position:relative;z-index:3;background:#fff;border-radius:999px;padding:4px 6px 4px 8px}
#sheet .tip{background:#fff;border-color:#fff;box-shadow:0 12px 32px rgba(31,24,19,.28);animation:풍선 .22s ease-out both}
@keyframes 풍선{0%{opacity:0;transform:translateY(6px) scale(.97)}100%{opacity:1;transform:none}}
#sheet .tip::before{content:'';position:absolute;right:6px;top:-6px;width:10px;height:10px;background:#fff;border-left:1px solid #e6ddd2;border-top:1px solid #e6ddd2;transform:rotate(45deg)}
#sheet .tip .t1{font-size:14px;font-weight:700;color:var(--tx)}
#sheet .tip{word-break:keep-all}
#sheet .tip .t2{font-size:13px;font-weight:500;color:var(--s2);margin-top:4px;line-height:1.45}
#sheet .tip .t0{font-size:11px;font-weight:500;color:var(--s3);opacity:.85;margin-bottom:8px}   /* 11/27 대표 「다 잘 보여서 기준이 아쉬움 · 권고 기준은 더 작게 옅게」 → 출처 줄 11px (범례와 같은 예외) */
#sheet .tip .t3{font-size:13px;font-weight:500;color:var(--s3);margin-top:2px}
#sheet .st .lg i{width:16px;height:16px;border-radius:5px;border:1.5px dashed #c9bfb3;background:#fff}
#sheet .grid9{position:relative;border-radius:12px;overflow:hidden}
#sheet .grid9.pop{animation:튐 .45s .12s cubic-bezier(.3,1.5,.5,1) both}
@keyframes 튐{0%{transform:scale(.9);opacity:.4}100%{transform:scale(1);opacity:1}}
#sheet .grid9::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.6) 50%,transparent 62%) no-repeat;background-size:250% 100%;background-position:160% 0;opacity:0}
#sheet .grid9.pop::after{animation:광택 .8s .45s ease-out both}
@keyframes 광택{0%{background-position:160% 0;opacity:1}100%{background-position:-60% 0;opacity:1}}
@media (prefers-reduced-motion:reduce){#sheet .grid9.pop,#sheet .grid9.pop::after,#sheet .st .h1 b.pop{animation:none}}
#sheet .st .h2{font-size:13px;font-weight:500;color:var(--s3);margin-top:4px;line-height:1.5}
#sheet .grid{display:block}
#sheet .grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#sheet .ms2{display:flex;gap:4px;margin-bottom:10px}
#sheet .ms2 button{height:28px;padding:0 10px;border-radius:999px;border:1px dashed #c9bfb3;background:#fff;font:inherit;font-size:12px;font-weight:700;color:var(--s3);cursor:pointer}
#sheet .ms2 button.on{border-style:solid;border-color:var(--br);color:var(--br)}
#sheet .lbl{font-size:13px;font-weight:800;color:var(--s3);margin:4px 0 6px}
#sheet .big{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
#sheet .big .tile{height:64px;flex-direction:column;display:flex;align-items:center;justify-content:center;gap:2px;color:#5d5249;border-color:var(--br)}
#sheet .big .tile small{font-size:12px;font-weight:700;color:var(--br)}
#sheet .none{grid-column:1/-1;font-size:14px;color:var(--s3);padding:10px 0}
#sheet .sm{display:flex;flex-wrap:wrap;gap:6px}
#sheet .chip2{height:32px;padding:0 12px;border-radius:999px;display:flex;align-items:center;font-size:13px;font-weight:800;color:#1f1813;cursor:pointer}
#sheet .lst{display:flex;flex-direction:column;gap:6px}
#sheet .ln{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);cursor:pointer}
#sheet .ln i{width:14px;height:14px;border-radius:4px}
#sheet .ln.no i{border:1.5px dashed #c9bfb3}
#sheet .ln b{font-size:15px;flex:1}
#sheet .ln.no b{color:var(--s2)}
#sheet .ln .pts{display:flex;gap:3px}
#sheet .ln .pt{width:9px;height:9px;border-radius:50%}
#sheet .ln .pt.no{border:1.5px solid #c9bfb3}
#sheet .ln .gt{color:var(--s3);font-weight:800}
#sheet .tile{height:56px;border-radius:12px;display:grid;place-items:center;font-size:15px;font-weight:700;color:#1f1813}
#sheet .tile.no{background:#fff;border:1.5px dashed #d2c8bc;color:var(--s3)}
#sheet .close{margin-top:14px;width:100%;height:52px;border-radius:12px;border:0;background:var(--br);color:#fbf8f4;font:inherit;font-size:16px;font-weight:800;cursor:pointer}
#sheet .tile{cursor:pointer}
#one .back{margin:0 8px 0 0;border-color:var(--line);color:#5d5249}
#one .hd{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:6px}
#one .hd b{font-size:16px;font-weight:800;color:var(--tx)}
#one .hd .cnt{font-size:13px;color:var(--s3);font-weight:500}
#one .ms{display:flex;justify-content:center;gap:4px;margin:0 0 8px}
#one .ms button{height:28px;padding:0 10px;border-radius:999px;border:1px dashed #c9bfb3;background:#fff;font:inherit;font-size:12px;font-weight:700;color:var(--s3);cursor:pointer}
#one .ms button.on{border-style:solid;border-color:var(--br);color:var(--br)}
#one .sl{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#one .sl::-webkit-scrollbar{display:none}
#one .sl .rw{flex:none;scroll-snap-align:start;width:auto;padding:0 12px}
#one .one1{display:flex;align-items:center;gap:8px;height:52px;border-radius:16px;background:#fff;border:1px solid var(--line);padding:0 6px;touch-action:pan-y}
#one .one1 button.ar{width:40px;height:40px;border:0;border-radius:12px;background:#f6f1ea;font:inherit;font-size:20px;font-weight:800;color:var(--br);cursor:pointer}
#one .one1 .mid{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-width:0}
#one .one1 .mid i{width:14px;height:14px;border-radius:4px}
#one .one1 .mid b{font-size:15px;font-weight:600;color:var(--tx)}
#one .one1 .mid .st{font-size:13px;font-weight:500;color:var(--s3)!important}
#one .dots{display:flex;justify-content:center;gap:5px;margin-top:6px}
#one .dots span{width:6px;height:6px;border-radius:50%;background:#d8cfc4}
#one .dots span.on{background:var(--br)}
#one .rws{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}   /* 위 3D 칸과 같은 폭 (11/27 「좌우 여백이 남는 이유」) */
#one .rw{display:flex;align-items:center;gap:7px;min-width:0;height:42px;padding:0 10px;border-radius:12px;background:#fff;border:1px solid var(--line);text-align:left;cursor:pointer}
#one .rw i{width:12px;height:12px;border-radius:3px;flex:none}
#one .rw .nm{flex:1;min-width:0;font-size:14px;font-weight:600;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#one .rw .st{font-size:13px;font-weight:500;color:var(--s3)!important;white-space:nowrap}
#one i.q0{background:#fff!important;border:1.5px dashed #c9bfb3}   /* 안 했어요 = 점선 네모 · 조금 = 옅은 색 · 충분 = 색 (11/27) */
#lg3{position:absolute;right:18px;top:16px;display:flex;flex-direction:column;gap:0;font-size:11px;line-height:1.4;letter-spacing:-.2px;font-weight:500;color:var(--s3);pointer-events:none;z-index:1}   /* 범례 (11/27 대표 「너무 커 더 줄여 · 강조는 모델과 자세히로」 → 13px 규칙 예외 · 범례만 11px) */
/* 11/27 대표 「자세히 버튼도 광택 계속」 → 브라운 채움 + 광택이 2.6초마다 지나감 */
#one #mb{position:relative;overflow:hidden;background:var(--br);color:#fff;border-color:var(--br)}
#one #mb::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%) no-repeat;background-size:250% 100%;background-position:160% 0;animation:G광택 2.4s linear infinite;pointer-events:none}
@keyframes G광택{0%{background-position:160% 0}71%,100%{background-position:-60% 0}}   /* v2 4장 A : 2.4초 한 바퀴 = 1.7초 지나감 + 0.7초 쉼 */
@media (prefers-reduced-motion:reduce){#one #mb::after{animation:none}}
#lg3[hidden]{display:none}
#lg3 div{display:flex;align-items:center;gap:4px}
#lg3 i{width:8px;height:8px;border-radius:2px;flex:none}
#one .rw.no .nm{color:var(--s2)}
#one .kan{display:inline-flex;align-items:center;gap:4px;margin:3px 3px 0;height:28px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:800}
#one .kan.no{background:#fff;border:1px dashed #d2c8bc;color:var(--s3)}
#one button{margin-left:6px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--br);background:#fff;color:var(--br);font:inherit;font-size:13px;font-weight:800;cursor:pointer;vertical-align:1px}
</style></head><body>
<div id="wrap">
  <h1>3D 근육 시험 <small style="font-size:13px;color:#837666;font-weight:500">워너비 남성 · 근육 21칸</small></h1>
  <p class="s">몸을 누르면 근육별로</p>
  <div class="an"><button data-p="오늘">오늘</button><button class="on" data-p="주">이번 주</button><button data-p="달">이번 달</button></div>
  <div id="v"><div id="ld">몸 불러오는 중…</div><div class="zm"><button id="zin" aria-label="확대">＋</button><button id="zout" aria-label="축소">−</button></div><button id="bk2" hidden>‹ 뒤로</button><div id="lg3"></div></div>
  <div id="one"></div>
</div>
<div id="dim" hidden></div>
<div id="sheet" aria-hidden="true"><div class="grab"></div><div class="st" id="stT"></div><div class="grid" id="grid"></div><button class="close" id="shut">닫기</button></div>
<script>
/* 11/27 「또 멈췄어」 : 앱이 고친 파일을 미리보기(data: · file:) 탭으로 열면 인터넷 · 3D 파일이 막혀 「불러오는 중」에서 멈춤 → 3D 부품보다 먼저 안내 */
(() => { if(!/^https?:$/.test(location.protocol)){ const 안내 = document.getElementById('ld'); if(안내) 안내.innerHTML = '이 탭은 미리보기라 3D 를 못 불러와요<br><b>첫 번째 탭(localhost:8791)</b>에서 보세요'; } })();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// 11/27 대표 확정 : 그림 하나 = 뜻 하나 「충분히 했다 / 안 했다」 · 색 = 앱 2D 몸 그림 부위 색(몸2색) · 근육 면 통째로
// 11/27 대표 「조사해서 기준」 → ACSM 2026 지침 : 근육 키우기 = 부위마다 주 약 10세트 → 부위 합 기준 : 오늘 1 · 이번 주 10 · 이번 달 40(10 × 4주)
// 세부 칸 = 부위 기준 ÷ 그 부위 칸 수 (올림) — 칸마다 10세트를 요구하면 아무도 못 채움 · 오늘은 칸도 1
const 기준 = { 오늘: 1, 주: 10, 달: 40 }, 기간이름 = { 오늘: '오늘', 주: '이번 주', 달: '이번 달' };
const 몸색 = '#c9c4be';
const 부위 = { 가슴: ['chest_up', 'chest'], 어깨: ['delt_f', 'delt_s', 'delt_r'], 등: ['trap', 'midback', 'lats', 'lowback'], 팔: ['biceps', 'triceps', 'forearm'],
  복근: ['abs', 'oblique'], 엉덩이: ['glute', 'glute_med'], '앞 허벅지': ['quad', 'adductor'], '뒤 허벅지': ['ham'], 종아리: ['calf', 'shin'] };
const 몸2색 = { 가슴: '#d98c7a', 어깨: '#e0b070', 등: '#7fa8c9', 팔: '#b39ad6', 복근: '#e2c96a', 엉덩이: '#e07a8a', '앞 허벅지': '#7fc9a0', '뒤 허벅지': '#c9a0e8', 종아리: '#8fd0d6' };
const 칸부위 = {}; Object.entries(부위).forEach(([b, ks]) => ks.forEach(k => 칸부위[k] = b));
const 이름 = { chest_up: '윗가슴', chest: '가슴', delt_f: '앞어깨', delt_s: '옆어깨', delt_r: '뒤어깨', biceps: '이두', triceps: '삼두', forearm: '전완', abs: '복근', oblique: '옆구리',
  trap: '승모', midback: '회전근개', lats: '광배', lowback: '허리(기립근)', glute: '엉덩이', glute_med: '엉덩이 옆', quad: '대퇴사두', ham: '햄스트링', adductor: '허벅지 안쪽', calf: '종아리', shin: '정강이' };
const 세트 = {   // 예시 기록 (칸마다 세트 수 · 실제 앱은 기록에서 계산)
  오늘: { quad: 8, glute: 6, ham: 4, adductor: 3 },
  주: { chest: 6, chest_up: 4, delt_f: 4, delt_s: 3, delt_r: 4, lats: 8, midback: 4, trap: 3, biceps: 6, triceps: 6, abs: 3, glute: 8, glute_med: 3, quad: 9, adductor: 3, ham: 6 },   // 부위 합 : 6곳 10세트 이상 · 복근 · 뒤 허벅지 조금 · 종아리 0
  달: { chest: 24, chest_up: 16, delt_f: 16, delt_s: 10, delt_r: 14, lats: 30, midback: 16, trap: 12, lowback: 6, biceps: 22, triceps: 20, forearm: 4, glute: 30, glute_med: 10, quad: 32, adductor: 10, ham: 22,
        abs: 12, oblique: 4, calf: 6 } };   // 부위 합 : 6곳 40세트 이상 · 복근 · 뒤 허벅지 · 종아리 조금
let 기간 = '주';
